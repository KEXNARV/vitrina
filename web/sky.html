<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vitrina · Laboratorio de cielo</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #panel {
    position: fixed; top: 12px; right: 12px; z-index: 10;
    background: rgba(10, 14, 22, 0.82); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px; padding: 14px 16px; width: 240px;
    font: 12px/1.5 monospace; color: #cdd6e4; backdrop-filter: blur(6px);
  }
  #panel label { display: block; margin-top: 8px; color: #8fd8e8; letter-spacing: 1px; }
  #panel input[type=range] { width: 100%; accent-color: #22d3ee; }
  #fps { position: fixed; left: 14px; bottom: 12px; z-index: 10;
         font: 14px monospace; color: #22d3ee; opacity: 0.8; }
  #toggle { position: fixed; top: 12px; right: 264px; z-index: 11; cursor: pointer;
            font: 16px monospace; color: #8fd8e8; user-select: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="fps"></div>
<div id="toggle" title="ocultar panel">◑</div>
<div id="panel">
  <b>CIELO · LAB</b>
  <label>Hora del día: <span id="vHour"></span></label>
  <input type="range" id="hour" min="0" max="24" step="0.1">
  <label>Cobertura: <span id="vCover"></span></label>
  <input type="range" id="cover" min="0" max="1" step="0.01" value="0.75">
  <label>Oscuridad (tormenta): <span id="vDark"></span></label>
  <input type="range" id="dark" min="0" max="1" step="0.01" value="0.38">
  <label>Viento: <span id="vWind"></span></label>
  <input type="range" id="wind" min="0" max="4" step="0.1" value="1">
  <label><input type="checkbox" id="debug"> ver campo de densidad</label>
  <label>Pasos de marcha: <span id="vSteps"></span></label>
  <input type="range" id="steps" min="16" max="96" step="8" value="64">
</div>

<script>
// ─── Shader de cielo volumétrico ──────────────────────────────
// Raymarch por una capa 3D de nubes con:
//  · marcha de sombra hacia el sol (4 muestras) + Beer-Lambert
//  · powder effect (los bordes iluminados "brillan por dentro")
//  · fase Henyey-Greenstein (silver lining direccional real)
//  · ambiente bicolor (cielo arriba, bruma abajo)
// El ruido 3D viene de una textura 2D con el truco R/G desplazado,
// idéntico al NoiseTex.kt del móvil para que el port sea 1:1.

const FRAG = `
precision highp float;
uniform vec2  uRes;
uniform float uTime;
uniform float uCover;
uniform float uDark;
uniform float uWind;
uniform float uSteps;
uniform vec3  uTop;
uniform vec3  uBot;
uniform vec3  uSunCol;
uniform vec3  uSunDir;
uniform float uGlow;
uniform sampler2D uNoise;
uniform float uDebug;

float hash12(vec2 p) {
    p = 50.0 * fract(p * 0.3183099 + vec2(0.71, 0.113));
    return fract(p.x * p.y * (p.x + p.y));
}

float noise3(vec3 x) {
    vec3 p = floor(x);
    vec3 f = fract(x);
    f = f * f * (3.0 - 2.0 * f);
    vec2 uv = (p.xy + vec2(37.0, 17.0) * p.z) + f.xy;
    vec2 rg = texture2D(uNoise, (uv + 0.5) / 256.0).rg;
    return mix(rg.r, rg.g, f.z);
}

float map(vec3 pos, float oct) {
    vec3 wind = vec3(uTime * 0.06 * uWind, uTime * 0.01, uTime * 0.02 * uWind);
    vec3 q = pos * vec3(0.70, 0.55, 0.70) - wind;
    float f = 0.0;
    float amp = 0.5;
    f += amp * noise3(q);
    if (oct > 1.5) { q = q * 2.02 + vec3(1.7, 4.1, 9.3); amp *= 0.5; f += amp * noise3(q); }
    if (oct > 2.5) { q = q * 2.03 + vec3(8.2, 0.5, 3.1); amp *= 0.5; f += amp * noise3(q); }
    if (oct > 3.5) { q = q * 2.01 + vec3(2.9, 7.7, 0.8); amp *= 0.5; f += amp * noise3(q); }
    if (oct > 4.5) { q = q * 2.02 + vec3(5.1, 2.2, 6.4); amp *= 0.5; f += amp * noise3(q); }
    f /= (1.0 - amp);

    float baseVar = noise3(vec3(pos.x * 0.16, pos.z * 0.16, 7.7));
    float yBase = 0.45 + baseVar * 0.85;
    float h = clamp((pos.y - yBase) / 2.0, 0.0, 1.0);
    float profile = smoothstep(0.0, 0.24, h) * smoothstep(1.0, 0.35, h);

    profile = mix(profile, smoothstep(0.0, 0.24, h), uDark * 0.7);
    vec3 dir = normalize(pos + vec3(0.0, 0.001, 0.0));
    float toSun = clamp(dot(dir, normalize(uSunDir)), 0.0, 1.0);
    float clearing = (0.20 + 0.30 * uDark) * pow(toSun, 9.0);

    float d = f * profile * 1.55 + (uCover * 0.68 - 0.76) - clearing;
    return clamp(d * 2.8, 0.0, 1.0);
}

float lightMarch(vec3 pos, vec3 sun) {
    float d = 0.0;
    d += map(pos + sun * 0.30, 3.0);
    d += map(pos + sun * 0.80, 2.0);
    d += map(pos + sun * 1.60, 2.0);
    return max(exp(-d * 1.4), 0.28 * exp(-d * 0.35));
}

float phaseHG(float c, float g) {
    float g2 = g * g;
    return (1.0 - g2) / (4.0 * 3.14159 * pow(1.0 + g2 - 2.0 * g * c, 1.5));
}

// Cielo despejado: gradiente + sol
vec3 skyBase(vec3 rd, vec3 sun) {
    float horizon = clamp(rd.y * 1.8, 0.0, 1.0);
    vec3 col = mix(uBot, uTop, pow(horizon, 0.7));
    float sunAmt = clamp(dot(rd, sun), 0.0, 1.0);
    col += uSunCol * uGlow * (pow(sunAmt, 900.0) * 3.0 + pow(sunAmt, 12.0) * 0.5
                              + pow(sunAmt, 2.5) * 0.15);
    return col;
}

// Nubes raymarched; pasos parametrizados (reflejo usa menos)
vec4 clouds(vec3 ro, vec3 rd, vec3 sun, float steps, vec2 seed) {
    float cosA = dot(rd, sun);
    float ph = mix(phaseHG(cosA, 0.32), phaseHG(cosA, -0.12), 0.35) * 12.0;
    vec3 acc = vec3(0.0);
    float T = 1.0;
    if (rd.y > 0.02) {
        float t0 = (0.45 - ro.y) / rd.y;
        float t1 = min((3.0 - ro.y) / rd.y, 16.0);
        float dt = (t1 - t0) / steps;
        float t = t0 + dt * hash12(seed);
        for (int i = 0; i < 96; i++) {
            if (float(i) >= steps || T < 0.008) break;
            vec3 pos = ro + rd * t;
            float den = map(pos, 5.0);
            if (den > 0.01) {
                float lt = lightMarch(pos, sun);
                float powder = 1.0 - exp(-den * 6.0);
                float hgt = clamp((pos.y - 0.45) / 2.5, 0.0, 1.0);
                vec3 amb = mix(uBot * 1.1, uTop * 1.2 + 0.30, hgt) * (1.15 - 0.82 * uDark);
                vec3 lum = amb * (0.72 - den * 0.38)
                         + uSunCol * lt * powder * ph * (1.0 - 0.6 * uDark)
                         + uSunCol * lt * 0.16;
                lum = mix(uBot * 1.05, lum, exp(-t * 0.055));
                float sigma = den * (1.1 + 0.6 * uDark);
                float a = 1.0 - exp(-sigma * dt * 3.6);
                acc += T * lum * a;
                T *= 1.0 - a;
            }
            t += dt;
        }
    }
    float fogAmt = exp(-max(rd.y - 0.02, 0.0) * 6.0);
    acc = mix(acc, uBot * (1.0 - T), fogAmt * 0.6);
    float horizFade = smoothstep(0.02, 0.18, rd.y);
    acc *= horizFade;
    T = mix(1.0, T, horizFade);
    return vec4(acc, T);
}

// ─── Terreno v2: receta verificada (Rainforest/iq + Musgrave + Frostbite) ───

vec3 noise2d(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    float a = hash12(i);
    float b = hash12(i + vec2(1.0, 0.0));
    float c = hash12(i + vec2(0.0, 1.0));
    float d = hash12(i + vec2(1.0, 1.0));
    vec2 u = f * f * (3.0 - 2.0 * f);
    vec2 du = 6.0 * f * (1.0 - f);
    float k3 = a - b - c + d;
    return vec3(
        a + (b - a) * u.x + (c - a) * u.y + k3 * u.x * u.y,
        du.x * ((b - a) + k3 * u.y),
        du.y * ((c - a) + k3 * u.x)
    );
}

// fbm con derivadas ANALÍTICAS encadenadas (Rainforest fbmd):
// devuelve (valor, d/dx, d/dz) exactos — las normales salen gratis.
// Erosión suave por derivadas acumuladas (morenoise) SIN ridged.
vec3 fbmd(vec2 p, float oct) {
    float a = 0.0;
    float b = 0.5;
    vec2 d = vec2(0.0);
    vec2 dsum = vec2(0.0);
    mat2 m = mat2(1.0, 0.0, 0.0, 1.0);
    mat2 m2 = mat2(0.80, -0.60, 0.60, 0.80);
    for (int i = 0; i < 9; i++) {
        if (float(i) >= oct) break;
        vec3 n = noise2d(p);
        float ero = 1.0 / (1.0 + 0.75 * dot(dsum, dsum));
        a += b * n.x * ero;
        d += b * (m * n.yz) * ero;
        dsum += m * n.yz;
        b *= 0.55;
        p = 1.9 * m2 * p;
        m = 1.9 * m2 * m;
    }
    return vec3(a, d);
}

// smoothstep con derivada (para el aplanado de valles con chain rule)
vec2 smoothstepd(float a, float b, float x) {
    if (x < a) return vec2(0.0);
    if (x > b) return vec2(1.0, 0.0);
    float ir = 1.0 / (b - a);
    float t = (x - a) * ir;
    return vec2(t * t * (3.0 - 2.0 * t), 6.0 * t * (1.0 - t) * ir);
}

// terreno completo con derivadas exactas: fbm + valles aplanados +
// máscara del lago, TODO con regla de la cadena
vec3 terrainMapD(vec2 p) {
    vec3 e = fbmd(p * 0.30, 9.0);
    e.yz *= 0.30;                       // chain rule de la escala
    // valles aplanados (Rainforest): hunde y alisa lo bajo
    vec2 c = smoothstepd(0.15, 0.50, e.x);
    float flat0 = mix(0.12, 1.0, c.x);
    e.yz = e.yz * flat0 + e.x * c.y * e.yz * 0.88;
    e.x *= flat0;
    // máscara del lago con derivada radial
    float r = length(p);
    vec2 g = smoothstepd(3.0, 7.5, r);
    e.yz = e.yz * g.x + (e.x * g.y / max(r, 0.001)) * p;
    e.x *= g.x;
    return vec3(e.x * 2.6, e.yz * 2.6);
}

float terrainH(vec2 p, float oct) {
    float a = fbmd(p * 0.30, oct).x;
    a *= mix(0.12, 1.0, smoothstepd(0.15, 0.50, a).x);
    return a * smoothstep(3.0, 7.5, length(p)) * 2.6;
}

float marchTerrain(vec3 ro, vec3 rd, float tStart, float oct, float steps) {
    float t = tStart;
    for (int i = 0; i < 44; i++) {
        if (float(i) >= steps) break;
        vec3 p = ro + rd * t;
        if (p.y > 2.8 && rd.y > 0.0) return -1.0;
        float dh = p.y - terrainH(p.xz, oct);
        if (dh < 0.012 * t) return t;
        t += dh * 0.6 + 0.02;
        if (t > 24.0) return -1.0;
    }
    return -1.0;
}

// sombra RAYMARCHED real con penumbra (rmshadows, iq) — lo falso se nota
float terrainShadow(vec3 ro, vec3 rd) {
    float res = 1.0;
    float t = 0.03;
    for (int i = 0; i < 20; i++) {
        vec3 pos = ro + rd * t;
        if (pos.y > 2.8) break;
        float hei = pos.y - terrainH(pos.xz, 4.0);
        res = min(res, 24.0 * hei / t);
        if (res < 0.002) break;
        t += clamp(hei, 0.04, 0.45);
    }
    return clamp(res, 0.0, 1.0);
}

// Overlay blend (Frostbite): rompe las máscaras sin perder los extremos
float overlayBlend(float v1, float v2, float op) {
    float ov = v1 < 0.5 ? 2.0 * v1 * v2 : 1.0 - 2.0 * (1.0 - v1) * (1.0 - v2);
    return mix(v1, ov, op);
}

vec4 mountains(vec3 ro, vec3 rd, vec3 sun, float tStart, float quality) {
    if (rd.y > 0.40) return vec4(0.0);

    float t = marchTerrain(ro, rd, tStart,
                           mix(4.0, 6.0, quality),
                           mix(20.0, 40.0, quality));
    if (t < 0.0) return vec4(0.0);

    vec3 p = ro + rd * t;
    vec3 md = terrainMapD(p.xz);
    vec3 n = normalize(vec3(-md.y, 1.0, -md.z));   // normal ANALÍTICA

    // bump solo en caras empinadas (Rainforest), con fade por distancia
    float detailFade = exp(-t * 0.14) * quality;
    if (detailFade > 0.04) {
        vec3 bn = noise2d(p.xz * 7.0);
        n = normalize(n + (1.0 - abs(n.y)) * 0.9 * detailFade * vec3(bn.y, 0.0, bn.z));
    }

    // ── luz estilo Rainforest: sol 5.0 / cielo 0.2 / backlight 0.35 ──
    float dif = clamp(dot(n, sun), 0.0, 1.0);
    float sha = 1.0;
    if (quality > 0.5 && dif > 0.01) sha = terrainShadow(p + n * 0.03, sun);
    float dom = 0.5 + 0.5 * n.y;
    vec3 backDir = normalize(vec3(-sun.x, 0.0, -sun.z));
    float bac = clamp(dot(n, backDir), 0.0, 1.0);
    float occ = clamp(0.4 + 0.6 * n.y * n.y, 0.0, 1.0);

    vec3 lin = 0.2 * mix(0.06 * vec3(0.12, 0.16, 0.10), uBot * 2.0, dom) * occ * (1.0 - 0.5 * uDark);
    lin += 5.0 * uSunCol * uGlow * dif * sha * (1.0 - 0.65 * uDark);
    lin += 0.35 * uBot * 1.5 * bac * occ;

    // ── material: ramps slope/height + Overlay breakup (Frostbite) ──
    float slope = 1.0 - n.y;
    float breakM = noise2d(p.xz * 2.2).x;
    float breakL = noise2d(p.xz * 0.55).x;
    float rockMask = smoothstep(0.20, 0.50, slope);
    rockMask = overlayBlend(rockMask, breakM, 0.55);
    float highMask = overlayBlend(smoothstep(0.7, 1.6, p.y), breakL, 0.5);

    vec3 veg  = mix(vec3(0.028, 0.038, 0.026), vec3(0.048, 0.056, 0.034), breakL);
    vec3 rock = mix(vec3(0.058, 0.056, 0.058), vec3(0.100, 0.094, 0.086), breakM);
    rock = mix(rock, vec3(0.130, 0.128, 0.124), highMask * 0.7);
    vec3 alb = mix(veg, rock, rockMask);
    float micro = noise2d(p.xz * 13.0).x;
    alb *= 0.85 + 0.35 * mix(0.5, micro, detailFade);

    vec3 col = alb * lin;

    // niebla teñida del sol + jirones de valle según clima
    vec3 fogCol = uBot * 1.02 + uSunCol * uGlow * 0.35
                  * pow(clamp(dot(rd, sun), 0.0, 1.0), 8.0);
    float fog = 1.0 - exp(-t * 0.10);
    float mistTop = 0.50 + 0.40 * noise2d(p.xz * 0.4 + 31.0).x;
    float valleyMist = smoothstep(mistTop + 0.30, mistTop - 0.40, p.y)
                       * (0.25 + 0.55 * uCover);
    col = mix(col, fogCol, clamp(fog + valleyMist * (1.0 - fog), 0.0, 0.96));

    return vec4(col, 1.0);
}

void main() {
    vec2 uv = gl_FragCoord.xy / uRes;
    float aspect = uRes.x / uRes.y;

    if (uDebug > 0.5) {
        vec3 pos = vec3((uv.x - 0.5) * 12.0, 1.9, uv.y * 12.0);
        gl_FragColor = vec4(vec3(map(pos, 5.0)), 1.0);
        return;
    }

    vec2 ndc = vec2(uv.x * 2.0 - 1.0, uv.y * 2.0 - 1.0);

    // Cámara elevada sobre el lago (y=0.22); el agua es el plano y=0
    vec3 ro = vec3(0.0, 0.22, 0.0);
    vec3 rd = normalize(vec3(ndc.x * aspect * 0.62, 0.16 + ndc.y * 0.42, 1.0));
    vec3 sun = normalize(uSunDir);

    vec3 col;
    if (rd.y < 0.0) {
        // ─── AGUA ───
        float tw = -ro.y / rd.y;
        vec3 pw = ro + rd * tw;

        // olas: normal perturbada con dos escalas de ruido
        vec2 wuv = pw.xz * 2.6 + vec2(uTime * 0.09, uTime * 0.05);
        float e = 0.14;
        float hC = noise3(vec3(wuv, 3.3)) + 0.5 * noise3(vec3(wuv * 2.3, 7.7));
        float hX = noise3(vec3(wuv + vec2(e, 0.0), 3.3)) + 0.5 * noise3(vec3((wuv + vec2(e, 0.0)) * 2.3, 7.7));
        float hZ = noise3(vec3(wuv + vec2(0.0, e), 3.3)) + 0.5 * noise3(vec3((wuv + vec2(0.0, e)) * 2.3, 7.7));
        float waveAmp = 0.045 / (1.0 + tw * 0.25);
        vec3 n = normalize(vec3((hC - hX) / e * waveAmp, 1.0, (hC - hZ) / e * waveAmp));

        vec3 rr = reflect(rd, n);
        rr.y = max(rr.y, 0.015);

        // reflejo: cielo + nubes ligeras + montañas invertidas
        vec3 refl = skyBase(rr, sun);
        vec4 rcl = clouds(ro, rr, sun, 8.0, gl_FragCoord.xy * 1.7 + 3.1);
        refl = refl * rcl.a + rcl.rgb;
        vec4 rm = mountains(pw + vec3(0.0, 0.005, 0.0), rr, sun, 0.05, 0.0);
        refl = mix(refl, rm.rgb, rm.a);

        // Fresnel: rasante espeja, picado muestra el agua oscura
        float fres = 0.05 + 0.95 * pow(1.0 - clamp(dot(-rd, n), 0.0, 1.0), 5.0);
        vec3 deep = uBot * 0.16 * (1.0 - 0.45 * uDark);
        col = mix(deep, refl, clamp(fres * 1.7, 0.0, 1.0));

        // bruma sobre el agua lejana: se funde con el horizonte
        col = mix(col, uBot * 0.98, 1.0 - exp(-tw * 0.09));
    } else {
        // ─── CIELO ───
        col = skyBase(rd, sun);
        vec4 cl = clouds(ro, rd, sun, uSteps, gl_FragCoord.xy);
        col = col * cl.a + cl.rgb;
        vec4 m = mountains(ro, rd, sun, 1.5, 1.0);
        col = mix(col, m.rgb, m.a);
    }

    col = 1.0 - exp(-col * 1.6);
    col = pow(col, vec3(1.18));
    vec2 vc = (uv - 0.5) * vec2(aspect, 1.0);
    col *= 1.0 - 0.30 * smoothstep(0.45, 1.0, length(vc));
    col += (hash12(gl_FragCoord.xy + 0.7) - 0.5) * 0.006;

    gl_FragColor = vec4(col, 1.0);
}
`;

const VERT = `
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
`;

// ─── Boilerplate WebGL ────────────────────────────────────────
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', { antialias: false });

function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
        throw new Error(gl.getShaderInfoLog(s));
    return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

// Textura de ruido: idéntica a NoiseTex.kt (R crudo, G desplazado 37,17)
const N = 256;
const base = new Uint8Array(N * N);
let seed = 20260703;
const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
for (let i = 0; i < N * N; i++) base[i] = (rnd() * 256) | 0;
const px = new Uint8Array(N * N * 4);
for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = (y * N + x) * 4;
    px[i]     = base[y * N + x];
    px[i + 1] = base[((y + 17) & 255) * N + ((x + 37) & 255)];
    px[i + 2] = 0; px[i + 3] = 255;
}
const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, N, N, 0, gl.RGBA, gl.UNSIGNED_BYTE, px);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

// ─── Paleta circadiana (port de SkyLayer.kt) ──────────────────
const NIGHT = { top:[0.006,0.009,0.022], bot:[0.028,0.042,0.075], sun:[0.80,0.85,0.95] };
const DAWN  = { top:[0.030,0.035,0.070], bot:[0.360,0.220,0.140], sun:[1.00,0.70,0.40] };
const DAY   = { top:[0.170,0.300,0.550], bot:[0.520,0.580,0.660], sun:[1.00,0.90,0.70] };
const DUSK  = { top:[0.040,0.030,0.070], bot:[0.400,0.190,0.090], sun:[1.00,0.60,0.30] };
const KEYS = [[0,NIGHT],[5,NIGHT],[6.6,DAWN],[9,DAY],[16.8,DAY],[18.6,DUSK],[20.3,NIGHT],[24,NIGHT]];

function palette(hour) {
    for (let i = 0; i < KEYS.length - 1; i++) {
        const [h0, p0] = KEYS[i], [h1, p1] = KEYS[i + 1];
        if (hour >= h0 && hour <= h1) {
            const t = h1 === h0 ? 0 : (hour - h0) / (h1 - h0);
            const L = (a, b) => a.map((v, j) => v + (b[j] - v) * t);
            return { top: L(p0.top, p1.top), bot: L(p0.bot, p1.bot), sun: L(p0.sun, p1.sun) };
        }
    }
    return NIGHT;
}

// ─── UI ───────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const now = new Date();
$('hour').value = (now.getHours() + now.getMinutes() / 60).toFixed(1);
const qp = new URLSearchParams(location.search);
if (qp.has('debug')) $('debug').checked = true;
for (const k of ['hour','cover','dark','wind','steps']) if (qp.has(k)) $(k).value = qp.get(k);
$('toggle').onclick = () => {
    const p = $('panel');
    p.style.display = p.style.display === 'none' ? 'block' : 'none';
};

// ─── Render loop ──────────────────────────────────────────────
const U = {};
for (const n of ['uRes','uTime','uCover','uDark','uWind','uSteps','uTop','uBot','uSunCol','uSunDir','uGlow','uNoise','uDebug'])
    U[n] = gl.getUniformLocation(prog, n);

// Mostrar qué GPU está rindiendo el shader
try {
    const info = gl.getExtension('WEBGL_debug_renderer_info');
    const renderer = info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL)
                          : gl.getParameter(gl.RENDERER);
    const gpu = document.createElement('div');
    gpu.style.cssText = 'position:fixed;left:14px;bottom:34px;z-index:10;font:11px monospace;color:#8fd8e8;opacity:0.7';
    gpu.textContent = renderer;
    document.body.appendChild(gpu);
} catch (e) {}

let frames = 0, accum = 0, last = performance.now();
const t0 = performance.now();

function frame() {
    const nowMs = performance.now();
    const dt = (nowMs - last) / 1000; last = nowMs;
    accum += dt; frames++;
    if (accum > 0.5) {
        $('fps').textContent = `${(frames / accum).toFixed(0)} fps`;
        frames = 0; accum = 0;
    }

    const dpr = Math.min(window.devicePixelRatio, 2);
    const w = (canvas.clientWidth * dpr * 0.5) | 0;
    const h = (canvas.clientHeight * dpr * 0.5) | 0;
    if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w; canvas.height = h;
        gl.viewport(0, 0, w, h);
    }

    const hour = parseFloat($('hour').value);
    $('vHour').textContent = hour.toFixed(1) + 'h';
    $('vCover').textContent = $('cover').value;
    $('vDark').textContent = $('dark').value;
    $('vWind').textContent = $('wind').value;
    $('vSteps').textContent = $('steps').value;

    const pal = palette(hour);
    const dayProg = (hour - 6.0) / 12.5;
    const isDay = dayProg >= 0 && dayProg <= 1;
    const prog2 = isDay ? dayProg
        : Math.min(1, Math.max(0, (hour >= 18.5 ? hour - 18.5 : hour + 5.5) / 11.5));
    const elev = Math.sin(Math.PI * prog2);
    const sunDir = [Math.cos(Math.PI * prog2) * 0.85, 0.06 + elev * 0.85, 0.55];

    gl.uniform2f(U.uRes, w, h);
    gl.uniform1f(U.uTime, (nowMs - t0) / 1000);
    gl.uniform1f(U.uCover, parseFloat($('cover').value));
    gl.uniform1f(U.uDark, parseFloat($('dark').value));
    gl.uniform1f(U.uWind, parseFloat($('wind').value));
    gl.uniform1f(U.uSteps, parseFloat($('steps').value));
    gl.uniform3fv(U.uTop, pal.top);
    gl.uniform3fv(U.uBot, pal.bot);
    gl.uniform3fv(U.uSunCol, pal.sun);
    gl.uniform3fv(U.uSunDir, sunDir);
    gl.uniform1f(U.uGlow, isDay ? 1.0 : 0.45);
    gl.uniform1i(U.uNoise, 0);
    gl.uniform1f(U.uDebug, $('debug').checked ? 1 : 0);

    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
}
frame();
</script>
